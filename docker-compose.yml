version: '3.8'
services:
  postgres:
    image: postgres:12.0
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  odoo:
    image: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    depends_on:
      - postgres
    ports:
      - "8069:8069"
    volumes:
      - ../..:/opt/odoo
      - ../..:/opt/odoo/addons
    environment:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    command: >
      bash -c "
        oca_install_addons &&
        oca_init_test_database &&
        oca_run_tests fieldservice_stage_validation fieldservice_isp_flow
      "

volumes:
  postgres_data:
